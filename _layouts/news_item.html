---
layout: default
---

<div class="page-head">
  <div class="wrap">
    <p class="news-date">{{ page.date | date: "%-d %B %Y" }}</p>
    <h1>{{ page.title }}</h1>
  </div>
</div>

<div class="wrap page-body narrow">
  {% if page.image %}
    <img class="news-hero" src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title }}" loading="lazy" decoding="async">
  {% endif %}

  {{ content }}

  <p class="back-link"><a href="{{ '/news/' | relative_url }}">← All news</a></p>
</div>

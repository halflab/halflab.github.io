# ============================================================
#  PUBLICATIONS
#
#  Generated by tools/bib_to_yml.py from a BibTeX export.
#  To refresh, re-export (ORCID preferred — see the script) and run
#
#      python3 tools/bib_to_yml.py tools/publications.bib --merge
#
#  --merge keeps url / code / data / selected and anything else you
#  added by hand. Without it, the file is rebuilt from scratch.
#
#  WHAT GOES IN THIS LIST
#
#  Papers by anyone currently in the lab, published while they were
#  here, where the work is relevant to what the lab does. That is
#  wider than "papers with the group lead as an author" — a member's
#  first-author work with an outside supervisor belongs here — but it
#  is not everything they have ever written: a paper on an unrelated
#  topic, or one finished before they arrived, stays out.
#
#  In practice nothing is added automatically. A lab member who wants
#  a paper listed asks, and it is decided case by case.
#
#  Papers stay in the list when their author leaves. The work was
#  done here.
#
#  FIELDS
#    authors_full  the complete list, never abbreviated. Not shown on
#              the page — it feeds the co-author graph and the
#              structured data that search engines read.
#    tags      which strands of the lab the paper belongs to, any of
#              hf (high field) lf (low field) nn (neural networks)
#              bn (brain networks). These drive the coloured markers
#              and the filter buttons on the Publications page.
#              DRAFTED BY CLAUDE FROM TITLES — please correct.
#              A paper with no tags shows in the unfiltered list only.
#    url       where the title links to. Prefer the publisher page
#              (a https://doi.org/... link resolves there).
#    selected  1, 2, 3 ... marks a paper for the home page, in that
#              order. Leave blank for everything else.
#    note      free text shown after the venue, e.g. footnote for
#              joint senior authorship.
#
#  Joint senior authors: put a backslash-escaped asterisk after each
#  name — Smith J\*, Jones A\*. The backslash is for Markdown, which
#  would otherwise read a pair of asterisks as emphasis. Entries that
#  use one must be SINGLE-quoted: \* is not a legal escape inside a
#  double-quoted YAML string, and Jekyll will refuse to build. There
#  is no explanatory footnote; the asterisks stand on their own.
#
#  LONG AUTHOR LISTS are abbreviated to fit one line (about 165
#  characters at the current column width). The rule, in order:
#
#    - always show the first three and the last three authors, so a
#      list never ends in [...] and the senior authors are always there
#    - always show every lab member, wherever they fall
#    - then add as many more from the front as still fit, which
#      pushes the gap towards the end
#    - one [...] is preferred to two; two only happens when a lab
#      member sits too deep to reach with a prefix that fits
#
#  The complete lists are kept outside the repo — ask Claude for the
#  saved copy to restore one, or if the column ever gets wider.
# ============================================================


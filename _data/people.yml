# ============================================================
#  TEAM MEMBERS
#
#  Everyone is shown identically, in the order listed below.
#  Clicking a photo or name opens that person's bio.
#
#  To add someone: copy a block, change the values.
#  To remove someone: delete their block, or move them to the
#  `alumni` list at the bottom.
#
#  Fields — only `name` and `role` are required:
#    name    : full name
#    name_native : the same name in its original script, shown after the
#              Latin one in a lighter weight (e.g. 宋昕慧). Optional.
#    role    : job title
#    photo   : filename in assets/img/team/  (e.g. levente.jpg)
#              square photos work best, ~600x600px
#    bio     : the person's own words, as they wrote them — any length,
#              and any number of paragraphs. Leave as "[TO DO - Short Bio]"
#              until they send one.
#    email   : plain address, no "mailto:"
#    scholar : full Google Scholar profile URL
#    orcid   : just the ID, e.g. 0000-0002-1234-5678
#    github  : just the username
#    bluesky : full handle, e.g. name.bsky.social
#    website : full URL
# ============================================================

people:

  - name: František Váša
    role: Group Lead
    photo: frantisek.jpg
    bio: |-
      I am a Senior Lecturer (Associate Professor) in Machine Learning and
      Computational Neuroscience in the Department of Neuroimaging at King's
      College London. I am excited about the potential of portable low-field MRI
      to widen access to neuroimaging, particularly when paired with AI methods
      that allow low-field scanners to “punch above their weight”. I also retain
      an interest in brain network analysis, the area that first drew me to
      neuroimaging.

      I studied mathematical physics at the University of Edinburgh, followed by
      biomedical engineering at Imperial College London. I then worked as a
      research assistant at Lausanne University Hospital with Patric Hagmann. My
      PhD, supervised by Ed Bullmore at the University of Cambridge, focused on
      correlation-derived brain networks. I went on to work on MRI pre-processing
      with Rob Leech and super-resolution with Rosalyn Moran, as a research
      associate at King's — before taking up a faculty position and starting the
      half lab.

      Outside of work, I enjoy board sports, indie comics and doughnuts.
    email: frantisek.vasa@kcl.ac.uk
    scholar: https://scholar.google.com/citations?user=wnLacTkAAAAJ&hl=en
    orcid: 0000-0001-6744-7139
    github: frantisekvasa
    bluesky: # frantisekvasa.bsky.social
    website: # https://...

  - name: Levente Baljer
    role: Postdoctoral Research Associate
    photo: levente.jpg
    bio: >-
      Levi is a PhD candidate (soon to be post-doc) specialising in the use of
      various deep learning techniques for the enhancement of ultra-low-field
      imaging. By training image translation models to produce synthetic high-field
      scans, his work aims to increase the viability of ultra-low-field scanners for
      use in downstream clinical and research tasks. His work is supervised by Dr.
      František Váša and Dr. Emma Robinson.
    email:
    scholar:
